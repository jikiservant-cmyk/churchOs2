name: CI

on:
  pull_request:
  push:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run security:audit
      - run: npm run build

  attendance-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: churchos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d churchos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Run attendance migration integration tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d churchos_test -v ON_ERROR_STOP=1 -f tests/sql/attendance_streaks.test.sql
